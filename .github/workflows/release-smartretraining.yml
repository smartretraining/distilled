name: release-smartretraining

# Publishes the @smartretraining/* packages and cuts one GitHub Release.
#
# VERSIONING — the one-version pattern, matching how alchemy-run/actions
# releases the upstream packages: every @smartretraining package shares a
# single version line and ships together under one `v<version>` tag. The
# version lives in each package.json and is bumped in a normal reviewed
# commit, so a release is always something a human approved. The workflow
# refuses to run if the packages disagree, or if the version is already on
# npm.
#
# This does NOT call `alchemy-run/actions/.github/workflows/release.yml`
# (which `release.yml` uses for the @distilled.cloud packages). That
# workflow authenticates its version-bump commit with a GitHub App via
# `ALCHEMY_VERSION_BOT_ID` / `ALCHEMY_VERSION_BOT_PRIVATE_KEY`, secrets
# belonging to the alchemy-run org with no GITHUB_TOKEN fallback. Rather
# than stand up an equivalent app here, the bump is a committed change and
# this workflow only publishes.
#
# PUBLISHING uses npm TRUSTED PUBLISHING (OIDC), so there is no npm token
# anywhere — not in a repository secret, not on a developer's machine.
# GitHub mints a short-lived, cryptographically-signed token scoped to this
# workflow and npm verifies it. Provenance attestations are generated
# automatically, tying each tarball to the commit and run that built it.
#
# ⚠️ THE FILENAME OF THIS WORKFLOW IS PART OF THE TRUST CONFIGURATION.
# npm matches releases against `release-smartretraining.yml` by name.
# Renaming or moving this file silently breaks publishing until the trusted
# publisher entry is updated on npmjs.com to match.
#
# One-time setup per package, on npmjs.com → package → Settings → Trusted
# Publisher: provider GitHub Actions, org `smartretraining`, repository
# `distilled`, workflow `release-smartretraining.yml`. A package must exist
# on the registry before it can be configured, so a brand-new package needs
# its first version published another way (see the README section on
# releasing).
#
# Requires npm >= 11.5.1 and Node >= 22.14.0; both are pinned below.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: >-
          Build, typecheck and pack, but do not publish, tag or release.
          Use this to rehearse a release.
        required: false
        type: boolean
        default: false

concurrency:
  group: release-smartretraining
  cancel-in-progress: false

env:
  PACKAGES: packages/rex packages/reapit

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the GitHub Release
      id-token: write # mint the OIDC token npm trusted publishing verifies
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so release notes can be generated against the
          # previous tag.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm (not bun) does the publishing: trusted publishing is an npm CLI
      # feature. Node 22 ships npm 10.x, which predates it, so the CLI is
      # upgraded explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: bun install --frozen-lockfile

      - name: Resolve and agree the version
        id: version
        run: |
          version=""
          for dir in $PACKAGES; do
            v=$(node -p "require('./$dir/package.json').version")
            name=$(node -p "require('./$dir/package.json').name")
            echo "  $name -> $v"
            if [ -z "$version" ]; then
              version="$v"
            elif [ "$v" != "$version" ]; then
              echo "::error::Packages disagree on the version ($v vs $version). The @smartretraining packages share one version line; bump them together."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to republish an existing version
        run: |
          for dir in $PACKAGES; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
              echo "::error::$name@${{ steps.version.outputs.version }} is already on npm. Bump the version first."
              exit 1
            fi
          done

      # `noCheck: true` in tsconfig.base.json means day-to-day builds only
      # emit. Nothing ships without being properly checked first.
      - name: Typecheck (strict)
        run: |
          for dir in $PACKAGES; do
            echo "== $dir"
            bunx tsc -p "$dir/tsconfig.json" --noEmit --noCheck false
          done

      - name: Build
        run: |
          for dir in $PACKAGES; do bunx tsc -b "$dir"; done

      - name: Pack
        run: |
          for dir in $PACKAGES; do (cd "$dir" && npm pack --dry-run); done

      # No NODE_AUTH_TOKEN: authentication is the OIDC token minted from the
      # `id-token: write` permission above, and provenance is generated
      # automatically under trusted publishing.
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: |
          for dir in $PACKAGES; do
            echo "== publishing $dir"
            (cd "$dir" && npm publish --access public)
          done

      - name: Tag and create the GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"

          notes=""
          for dir in $PACKAGES; do
            name=$(node -p "require('./$dir/package.json').name")
            notes="$notes- \`$name@${{ steps.version.outputs.version }}\`"$'\n'
          done

          gh release create "$tag" \
            --title "$tag" \
            --notes "Published to npm with trusted publishing (OIDC) — every tarball carries a provenance attestation linking it to this commit and workflow run.

          $notes" \
            --generate-notes
